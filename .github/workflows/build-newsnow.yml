name: build-newsnow

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit/ref to build
        required: true
        default: 0560c993b226cd2fd07d8a79875d50551f52c584

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show version
        run: |
          node -e "console.log('package version =', require('./package.json').version)"
          git log -1 --format='build commit = %H %ci'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}:v0.0.43 \
            --load .

      - name: Show image info
        run: |
          docker image inspect ghcr.io/${{ github.repository }}:v0.0.43 \
            --format '{{.Id}} {{.Config.Labels}}'

      - name: Save image to artifact
        run: |
          docker save ghcr.io/${{ github.repository }}:v0.0.43 | gzip -1 > /tmp/newsnow-v0.0.43-amd64.tar.gz
          ls -lh /tmp/newsnow-v0.0.43-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newsnow-v0.0.43-amd64
          path: /tmp/newsnow-v0.0.43-amd64.tar.gz
          retention-days: 3

      - name: Push to ghcr.io
        run: docker push ghcr.io/${{ github.repository }}:v0.0.43
